name: .NET

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: plugin-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate Version
        id: shell
        run: |
          echo "version=$(date -u '+%Y.%-m%d.%-H%M.0')" >> $GITHUB_OUTPUT

      - name: Build Plugins
        run: |
          dotnet build --configuration Release -p:Version=${{ steps.shell.outputs.version }}
          dotnet build --configuration Release.Emby -p:Version=${{ steps.shell.outputs.version }}

      - name: Test Manifest Generator
        run: |
          python3 -m pip install packaging
          python3 -m unittest discover -s scripts -p 'test_manifest.py'

      - name: Prepare Manifest Branch
        run: |
          git config user.name 'metatube-bot'
          git config user.email 'metatube-bot@users.noreply.github.com'
          dist_dir="$RUNNER_TEMP/metatube-dist"
          git ls-remote --heads origin refs/heads/dist > "$RUNNER_TEMP/metatube-dist-ref"
          if [ -s "$RUNNER_TEMP/metatube-dist-ref" ]; then
            git fetch origin dist
            git worktree add --detach "$dist_dir" FETCH_HEAD
          else
            git worktree add --detach "$dist_dir" HEAD
            git -C "$dist_dir" switch --orphan dist
          fi
          echo "METATUBE_MANIFEST_PATH=$dist_dir/manifest.json" >> "$GITHUB_ENV"

      - name: Generate Manifest
        run: |
          python3 scripts/manifest.py Jellyfin.Plugin.MetaTube/bin/Jellyfin.MetaTube@v${{ steps.shell.outputs.version }}.zip

      - name: Upload Plugins
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          body: |
            MetaTube build for Jellyfin 12.x (.NET 10) and Emby 4.9.x (.NET 8).
            Server runtime compatibility requires verification in your environment.
          draft: false
          tag_name: v${{ steps.shell.outputs.version }}
          target_commitish: ${{ github.sha }}
          fail_on_unmatched_files: true
          files: |
            Jellyfin.Plugin.MetaTube/bin/Jellyfin.MetaTube@v${{ steps.shell.outputs.version }}.zip
            Jellyfin.Plugin.MetaTube/bin/Emby.MetaTube@v${{ steps.shell.outputs.version }}.zip

      - name: Publish Manifest
        run: |
          dist_dir="$RUNNER_TEMP/metatube-dist"
          cp manifest.json "$dist_dir/manifest.json"
          git -C "$dist_dir" add manifest.json
          git -C "$dist_dir" commit -m "Publish plugin manifest"
          git -C "$dist_dir" push origin HEAD:refs/heads/dist
